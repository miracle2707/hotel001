<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ika Royal Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="stylesheet" href="css/style3.css">
    <link rel="stylesheet" href="font-awesome/css/font-awesome.min.css">
</head>

<body>
    <div class="index">
        <div id="login">
            <form>
                <div id="form">

                    <div style="display: flex; justify-content: center;">
                        <img src="image/Golden IKA Royal Hotel Emblem.png" width="200px">
                    </div>
                    <div>
                        <b id="logintext">Login to your Account</b><br>
                        <small style="display: flex; justify-content: center;">Enter your Login Details</small>
                    </div>
                    <div id="email-2">
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" placeholder="Enter Email" required>
                    </div>
                    <div id="email-2">
                        <label for="password">Password:</label><br>
                        <input type="password" id="password" placeholder="Enter Password" required>
                    </div>
                    <div id="checkbox">
                        <div>
                            <small><input type="checkbox"> Remember me</small>
                        </div>
                        <div>
                            <a href="#" style="color:blue; font-size: 15px;"><small>Forgot Password?</small></a>
                        </div>

                    </div>
                    <a href="#">

                        <div id="login-3">
                            Login
                        </div>
                    </a>
                    <div id="redirect">
                        <small>Don't have an account yet? <a href="registration.html"
                                style="font-size: 15px; color: blue;">Register Here</a></small>
                    </div>
                    <div id="icon">
                        <div style="display: flex; justify-content: center;"><small>Or Continue with:</small></div>
                        <div style="display: flex; gap: 10px;">
                            <div id="fa"><i class="fa fa-apple"></i> <small>Apple</small></div>
                            <div id="fa-2"><i class="fa fa-google" style="color: #C7392D;"></i> <small>Google</small>
                            </div>
                            <div id="fa-3"><i class="fa fa-facebook" style="color: blue;"></i> <small>Facebook</small>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>
        <div id="login-2">
             <div id="sideimage-2">
                <img src="image/Golden IKA Royal Hotel Emblem.png" width="150px">

            </div>
            <img src="image/1images.jpg" id="image-0">
        </div>

    </div>

</body>

</html>
