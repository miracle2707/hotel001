<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ika Royal Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="stylesheet" href="css/style3.css">
    <link rel="stylesheet" href="font-awesome/css/font-awesome.min.css">
</head>

<body>
    <div class="index">

        <div id="login-4">
            <img src="image/swim-up-family-suite_gouves_park_1_e31isu.jpg" id="image-0">
        </div>
        <div id="login-1">
            <form>
                <div id="form-2">

                    <div style="display: flex; justify-content: center;">
                        <img src="image/Golden IKA Royal Hotel Emblem.png" width="200px">
                    </div>
                    <div>
                        <b id="logintext">Register
                            your Account</b><br>
                        <small style="display: flex; justify-content: center;">Enter your Details</small>
                    </div>
                    <div style="width: 100%; display: flex;">
                        <div style="width: 100%;" class="confirm">
                            First Name:<br>
                            <input type="text" class="email" placeholder="First Name" required>
                        </div>
                        <div style="width: 100%;" class="confirm">
                            Last Name:<br>
                            <input type="text" class="email" placeholder="Last Name" required>
                        </div>
                    </div>
                    <div style="width: 100%; display: flex;">
                        <div style="width: 100%;" class="confirm">
                            Email:<br>
                            <input type="email" class="email" placeholder="Enter Email" required>
                        </div>
                        <div style="width: 100%;" class="confirm">
                            Phone no:<br>
                            <input type="tel" class="email" placeholder="Enter No" required>
                        </div>
                    </div>
                    <div style="width: 100%; display: flex;">
                        <div style="width: 100%;" class="confirm">
                            Password:<br>
                            <input type="password" class="password" placeholder="Enter Password" required>
                        </div>
                        <div style="width: 100%;" class="confirm">
                            Confirm Password:<br>
                            <input type="password" class="password" placeholder="Confirm Password" required>
                        </div>
                    </div>
                    <div id="checkbox-2">
                        <div>
                            <small><input type="checkbox"> I Agree to the <a href="#"
                                    style="font-size: 15px; color: blue;">Terms</a> and <a href="#"
                                    style="font-size: 15px; color: blue;">Conditons</a></small>
                        </div>


                    </div>
                    <a href="homepage.html">

                        <div id="login-3">
                            Register
                        </div>
                    </a>
                    <div id="redirect">
                        <small>Already have an account? <a href="login.html" style="font-size: 15px; color: blue;">Login
                                Here</a></small>
                    </div>
                    <div id="icon">
                        <div style="display: flex; justify-content: center;"><small>Or Continue with:</small></div>
                        <div style="display: flex; gap: 10px;">
                            <div id="fa"><i class="fa fa-apple"></i> <small>Apple</small></div>
                            <div id="fa"><i class="fa fa-google" style="color: #C7392D;"></i> <small>Google</small>
                            </div>
                            <div id="fa"><i class="fa fa-facebook" style="color: blue;"></i> <small>Facebook</small>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>



    </div>

</body>

</html>
